<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login | Sorglos Apps</title>
  <style>
    :root {
      --bg: #07111d;
      --surface: rgba(12, 21, 34, 0.9);
      --border: rgba(255,255,255,0.1);
      --accent: #8ff4c8;
      --accent-2: #8ab6ff;
      --text: #f3f7fd;
      --muted: #a5b3c8;
      --error: #ff6b7a;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(143,244,200,0.15), transparent 25%),
        radial-gradient(circle at 85% 15%, rgba(138,182,255,0.14), transparent 22%),
        linear-gradient(180deg, var(--bg), #030812);
      color: var(--text);
      display: grid;
      place-items: center;
    }
    .card {
      width: min(420px, calc(100% - 2rem));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem;
      backdrop-filter: blur(18px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .brand-mark {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.8rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #041019;
      font-size: 1rem;
    }
    .brand strong { font-size: 1rem; }
    .brand span { display: block; font-size: 0.78rem; color: var(--muted); }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 2rem; }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 0.8rem;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 180ms;
      margin-bottom: 1.2rem;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 0.95rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #041019;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 180ms, transform 180ms;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .error-banner {
      display: none;
      background: rgba(255,107,122,0.12);
      border: 1px solid rgba(255,107,122,0.3);
      color: var(--error);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.88rem;
      margin-bottom: 1.2rem;
    }
    .error-banner.visible { display: block; }
    .back { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
    .back a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <strong>Sorglos Apps</strong>
        <span>Admin-Bereich</span>
      </div>
    </div>

    <h1>Anmelden</h1>
    <p class="subtitle">Nur für autorisierte Administratoren.</p>

    <div id="error-banner" class="error-banner">
      Falscher Benutzername oder Passwort.
    </div>

    <form method="POST" action="/admin/login/">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" autocomplete="username" required placeholder="admin">

      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">

      <button class="btn" type="submit">Anmelden</button>
    </form>

    <p class="back"><a href="/">← Zurück zur Startseite</a></p>
  </div>

  <script>
    if (window.location.search.includes("error=1")) {
      document.getElementById("error-banner").classList.add("visible");
    }
  </script>
</body>
</html>
