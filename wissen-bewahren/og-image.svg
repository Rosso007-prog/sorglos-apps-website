<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Ein KI-Modell ist kein Archiv</title><desc id="d">Kampagnengrafik zur Bundestagspetition 207045</desc>
  <rect width="1200" height="630" fill="#f7f4ec"/><circle cx="1060" cy="100" r="250" fill="#dce9df"/>
  <rect x="710" y="120" width="320" height="390" rx="24" fill="#fffdf8" stroke="#174b3b" stroke-opacity=".18"/><rect x="710" y="120" width="18" height="390" fill="#d49d45"/>
  <text x="84" y="104" fill="#174b3b" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="3">BUNDESTAGSPETITION 207045</text>
  <text x="84" y="220" fill="#17251f" font-family="Georgia,serif" font-size="78"><tspan x="84" dy="0">Ein KI-Modell</tspan><tspan x="84" dy="88">ist kein Archiv.</tspan></text>
  <text x="84" y="460" fill="#53655d" font-family="Arial,sans-serif" font-size="27"><tspan x="84">KI darf aus Büchern lernen.</tspan><tspan x="84" dy="40">Unser Wissen darf dabei nicht verloren gehen.</tspan></text>
  <text x="770" y="205" fill="#53655d" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">WISSEN BEWAHREN</text><text x="770" y="415" fill="#17251f" font-family="Georgia,serif" font-size="43"><tspan x="770">Digitalisierung</tspan><tspan x="770" dy="52">mit Verantwortung.</tspan></text>
</svg>
