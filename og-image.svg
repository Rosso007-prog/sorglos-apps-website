<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07111d"/>
      <stop offset="100%" style="stop-color:#030812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8ff4c8"/>
      <stop offset="100%" style="stop-color:#8ab6ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="10%" cy="20%" r="35%">
      <stop offset="0%" style="stop-color:rgba(143,244,200,0.22)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="15%" r="30%">
      <stop offset="0%" style="stop-color:rgba(138,182,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0)"/>
    </radialGradient>
    <clipPath id="mark-clip">
      <rect rx="28" ry="28" width="120" height="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M 38 0 L 0 0 0 38" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>

  <!-- Brand mark -->
  <rect x="80" y="80" width="120" height="120" rx="28" ry="28" fill="url(#accent)"/>
  <text x="140" y="157" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-weight="800" font-size="64" fill="#041019">S</text>

  <!-- Headline -->
  <text x="80" y="290" font-family="system-ui,-apple-system,sans-serif"
        font-weight="800" font-size="72" fill="#f3f7fd" letter-spacing="-2">
    Sorglos Apps
  </text>
  <text x="80" y="370" font-family="system-ui,-apple-system,sans-serif"
        font-weight="400" font-size="36" fill="#a5b3c8">
    iOS Apps für iPhone, iPad &amp; Mac
  </text>

  <!-- Subline -->
  <text x="80" y="430" font-family="system-ui,-apple-system,sans-serif"
        font-weight="400" font-size="28" fill="#a5b3c8">
    Grilltimer · Pro Doku · Sortly · Neurobyte · und mehr
  </text>

  <!-- App Store badge area -->
  <rect x="80" y="490" width="280" height="60" rx="30" fill="url(#accent)" opacity="0.15"
        stroke="rgba(143,244,200,0.4)" stroke-width="1.5"/>
  <text x="220" y="528" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-weight="700" font-size="22" fill="#8ff4c8">Im Apple App Store</text>

  <!-- URL -->
  <text x="1120" y="590" text-anchor="end" font-family="system-ui,-apple-system,sans-serif"
        font-weight="400" font-size="22" fill="rgba(165,179,200,0.5)">sorglos-apps.de</text>

  <!-- Decorative right side app cards -->
  <rect x="780" y="140" width="340" height="160" rx="20" fill="rgba(255,255,255,0.04)"
        stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="780" y="140" width="340" height="1" fill="url(#accent)" opacity="0.4"/>
  <text x="810" y="192" font-family="system-ui,-apple-system,sans-serif"
        font-weight="700" font-size="22" fill="#f3f7fd">Grilltimer</text>
  <text x="810" y="222" font-family="system-ui,-apple-system,sans-serif"
        font-weight="400" font-size="17" fill="#a5b3c8">Mehrere Timer, Garzeiten-Guide</text>
  <text x="810" y="254" font-family="system-ui,-apple-system,sans-serif"
        font-weight="600" font-size="15" fill="#8ff4c8">Lifestyle · iPhone &amp; iPad</text>

  <rect x="780" y="320" width="340" height="160" rx="20" fill="rgba(255,255,255,0.04)"
        stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="780" y="320" width="340" height="1" fill="url(#accent)" opacity="0.4"/>
  <text x="810" y="372" font-family="system-ui,-apple-system,sans-serif"
        font-weight="700" font-size="22" fill="#f3f7fd">Pro Doku</text>
  <text x="810" y="402" font-family="system-ui,-apple-system,sans-serif"
        font-weight="400" font-size="17" fill="#a5b3c8">Baudokumentation &amp; PDF-Export</text>
  <text x="810" y="434" font-family="system-ui,-apple-system,sans-serif"
        font-weight="600" font-size="15" fill="#8ab6ff">Business · iPhone &amp; iPad</text>

  <rect x="780" y="500" width="160" height="80" rx="16" fill="rgba(255,255,255,0.03)"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="860" y="545" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-weight="600" font-size="16" fill="#a5b3c8">27+ Apps</text>

  <rect x="960" y="500" width="160" height="80" rx="16" fill="rgba(255,255,255,0.03)"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1040" y="545" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-weight="600" font-size="16" fill="#a5b3c8">5 Kategorien</text>
</svg>
